[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pywork"
version = "0.15.15"
description = "A long-running pile of small Python utilities."
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ethanmontanasmith" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_unused_ignores = true
disallow_untyped_defs = true
